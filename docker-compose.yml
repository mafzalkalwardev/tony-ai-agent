# Local/dev compose. For VPS production use: deploy/docker-compose.prod.yml
services:
  tony:
    build: .
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      TONY_LLM_PROVIDER: ${TONY_LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      OBSIDIAN_VAULT_PATH: /app/vault
      TONY_API_TOKEN: ${TONY_API_TOKEN:-docker_tony_token}
      TONY_WORKSPACE_ROOT: /app
    volumes:
      - ./vault:/app/vault
      - tony_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  tony_data:
