name: Deploy TONY to VPS

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'vault/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TONY_API_TOKEN: ${{ secrets.TONY_API_TOKEN }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$TONY_API_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Missing VPS_HOST / VPS_SSH_KEY / TONY_API_TOKEN — skipping deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Setup SSH key
        if: steps.check.outputs.skip != 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Write remote env from secrets
        if: steps.check.outputs.skip != 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TONY_API_TOKEN: ${{ secrets.TONY_API_TOKEN }}
          TONY_DOMAIN: ${{ secrets.TONY_DOMAIN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          TONY_USER_NAME: ${{ secrets.TONY_USER_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN_VAL: ${{ secrets.GH_TOKEN }}
          TONY_LLM_PROVIDER: ${{ secrets.TONY_LLM_PROVIDER }}
        run: |
          cat > .env <<EOF
          NODE_ENV=production
          TONY_ENV=production
          PORT=8787
          TONY_LLM_PROVIDER=${TONY_LLM_PROVIDER:-groq}
          GROQ_API_KEY=${GROQ_API_KEY}
          GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}
          DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
          ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
          TONY_API_TOKEN=${TONY_API_TOKEN}
          TONY_DOMAIN=${TONY_DOMAIN:-$VPS_HOST}
          TONY_USER_NAME=${TONY_USER_NAME:-Operator}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
          DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
          GITHUB_TOKEN=${GITHUB_TOKEN_VAL}
          TONY_SHELL_UNSAFE=false
          TONY_TRUSTED_MODE=false
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Deploy over SSH
        if: steps.check.outputs.skip != 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          TONY_DOMAIN: ${{ secrets.TONY_DOMAIN }}
        run: |
          chmod +x scripts/deploy-vps.sh
          export VPS_USER="${VPS_USER:-root}"
          export VPS_PORT="${VPS_PORT:-22}"
          export VPS_SSH_KEY="$HOME/.ssh/id_rsa"
          export TONY_DOMAIN="${TONY_DOMAIN:-$VPS_HOST}"
          ./scripts/deploy-vps.sh
